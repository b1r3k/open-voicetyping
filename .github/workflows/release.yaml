---
name: Build and Release .deb

on:
  push:
    tags:
      - "v*"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-poetry-core \
            python3-build python3-venv python3-dev build-essential \
            portaudio19-dev libmp3lame-dev libudev-dev

      - name: Sync debian version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: ${VERSION}"
          sed -i "1s/(.*)/(${VERSION}-1)/" debian/changelog

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../open-voicetyping_*-1_amd64.deb
          generate_release_notes: true
